databases:
  - name: crypto-predictions-db
    region: frankfurt
    plan: free # expires after 30 days: choose a paid plan with backups before real users
    databaseName: crypto_predictions
    user: crypto_app
    postgresMajorVersion: "16"

services:
  - type: web
    name: crypto-direction-api
    runtime: python
    region: frankfurt
    plan: free # sleeps when idle
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass # deploy only when GitHub Actions is green
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_DATABASE_URL
        fromDatabase:
          name: crypto-predictions-db
          property: connectionString
      - key: APP_CORS_ORIGINS
        sync: false
      - key: APP_BACKGROUND_JOBS
        value: "true"
      - key: APP_AUTO_FORECAST_SYMBOLS
        value: '["BTC/USDT","ETH/USDT","SOL/USDT","DOGE/USDT","XRP/USDT"]'
      - key: APP_FALLBACK_EXCHANGE_IDS
        value: '["kucoin"]'
      # Render is behind Cloudflare, which sets this header itself. Check after the first deploy.
      - key: APP_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: APP_METRICS_TOKEN
        generateValue: true
      # Optional: APP_REDIS_URL (needed for more than one instance), APP_SENTRY_DSN
